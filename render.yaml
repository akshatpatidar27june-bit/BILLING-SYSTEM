services:
  - type: web
    name: storycreateeditor
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storycreateeditor-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: storycreateeditor-db
